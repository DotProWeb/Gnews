name: Auto Publish News to Social Media

on:
  schedule:
    # প্রতি ৩০ মিনিট পর পর অফ-পিক মিনিটে (১৭ ও ৪৭) চলবে (গিটহাব কিউ বিলম্ব এড়াতে)
    - cron: '17,47 * * * *'
  workflow_dispatch: # ম্যানুয়ালি বা এক্সটার্নাল API দিয়ে তাৎক্ষণিক চালানোর জন্য

permissions:
  contents: write   # Required: commit posted_cache.json back to repo
  actions: none
  checks: none
  deployments: none
  issues: none
  packages: none
  pull-requests: none
  repository-projects: none
  security-events: none
  statuses: none

jobs:
  autopost:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Bengali Fonts & Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-core fonts-beng fonts-lohit-beng-bengali
          pip install --upgrade pip
          pip install pillow requests

      - name: Run Auto Publisher Script
        env:
          PYTHONIOENCODING: "utf-8"
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          WHATSAPP_API_TOKEN: ${{ secrets.WHATSAPP_API_TOKEN }}
          WHATSAPP_CHANNEL_JID: ${{ secrets.WHATSAPP_CHANNEL_JID }}
        run: |
          if [ -f "autopost.py" ]; then
            python autopost.py
          elif [ -f "social-autopost/autopost.py" ]; then
            python social-autopost/autopost.py
          else
            echo "❌ autopost.py not found!"
            exit 1
          fi

      - name: Commit and Push Updated Cache
        run: |
          git config --global user.name "GhatailBot"
          git config --global user.email "bot@ghatail.com"
          git add posted_cache.json
          if [ -f "social-autopost/posted_cache.json" ]; then
            git add social-autopost/posted_cache.json
          fi
          git commit -m "Update social auto-post cache [skip ci]" || echo "No changes to commit"
          git push
