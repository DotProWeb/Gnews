name: Auto Publish News to Social Media

on:
  schedule:
    # প্রতি ১০ মিনিট পরপর ব্যাকগ্রাউন্ডে স্বয়ংক্রিয়ভাবে চলবে
    - cron: '*/10 * * * *'
  workflow_dispatch: # চাইলে ম্যানুয়ালি ১-ক্লিকে GitHub Actions থেকে রান করা যাবে

permissions:
  contents: write

jobs:
  autopost:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Bengali Fonts & Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-core fonts-beng fonts-lohit-beng-bengali
          pip install --upgrade pip
          pip install pillow requests

      - name: Run Auto Publisher Script
        env:
          PYTHONIOENCODING: "utf-8"
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          WHATSAPP_API_TOKEN: ${{ secrets.WHATSAPP_API_TOKEN }}
          WHATSAPP_CHANNEL_JID: ${{ secrets.WHATSAPP_CHANNEL_JID }}
        run: |
          if [ -f "autopost.py" ]; then
            python autopost.py
          elif [ -f "social-autopost/autopost.py" ]; then
            python social-autopost/autopost.py
          else
            echo "❌ autopost.py not found!"
            exit 1
          fi

      - name: Commit and Push Updated Cache
        run: |
          git config --global user.name "GhatailBot"
          git config --global user.email "bot@ghatail.com"
          git add posted_cache.json social-autopost/posted_cache.json 2>/dev/null || true
          git commit -m "Update social auto-post cache [skip ci]" || echo "No changes to commit"
          git push
