<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@600;700;800&family=Noto+Sans+Bengali:wght@600;700;800;900&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1200px;
    height: 960px;
    background: #ffffff;
    font-family: 'Hind Siliguri', 'Noto Sans Bengali', sans-serif;
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
  }
  .hero-wrap {
    width: 1200px;
    height: 530px;
    position: relative;
    overflow: hidden;
    background: #0f172a;
  }
  .hero-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 25%;
  }
  .logo-badge {
    position: absolute;
    top: 494px;
    left: 50%;
    transform: translateX(-50%);
    background: #ffffff;
    border-radius: 999px;
    padding: 8px 36px;
    box-shadow: 0 10px 32px rgba(0,0,0,0.22);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    z-index: 25;
    min-height: 72px;
    border: 4px solid #ffffff;
  }
  .logo-badge img {
    height: 54px;
    width: auto;
    max-width: 320px;
    object-fit: contain;
    display: block;
  }
  .content-box {
    height: 280px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 48px 40px 0;
    background: #ffffff;
  }
  .headline-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 20px;
  }
  .headline {
    color: #b91c1c;
    font-size: 44px;
    font-weight: 700;
    line-height: 1.34;
    text-align: center;
    max-height: 155px;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    letter-spacing: -0.3px;
  }
  .meta-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 10px;
    border-top: 2px solid #f1f5f9;
    font-size: 22px;
    font-weight: 600;
    color: #475569;
  }
  .meta-center { color: #0f172a; font-weight: 700; }
  .meta-right { color: #2563eb; font-weight: 700; }
  .ad-slot {
    height: 150px;
    width: 1200px;
    position: relative;
    overflow: hidden;
    background: #087b37;
  }
  .ad-banner-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .ad-tag-badge {
    position: absolute;
    top: 8px;
    right: 12px;
    background: rgba(0, 0, 0, 0.7);
    color: #facc15;
    font-size: 13px;
    font-weight: 800;
    padding: 3px 10px;
    border-radius: 4px;
    letter-spacing: 0.5px;
    z-index: 5;
    border: 1px solid rgba(250, 204, 21, 0.4);
  }
</style>
</head>
<body>
  <div class="hero-wrap">
    <img class="hero-img" src="{{IMAGE_URL}}" alt="News Image">
  </div>
  <div class="logo-badge">
    <img src="{{LOGO_URL}}" alt="ঘাটাইল ডট কম">
  </div>
  <div class="content-box">
    <div class="headline-wrap">
      <h1 class="headline">{{HEADLINE}}</h1>
    </div>
    <div class="meta-bar">
      <span>🗓️ {{DATE}}</span>
      <span class="meta-center">«« বিস্তারিত কমেন্টে »»</span>
      <span class="meta-right">🌐 ghatail.com</span>
    </div>
  </div>
  <div class="ad-slot">
    <img class="ad-banner-img" src="{{AD_BANNER_URL}}" alt="বিজ্ঞাপন">
    <div class="ad-tag-badge">বিজ্ঞাপন</div>
  </div>
</body>
</html>
